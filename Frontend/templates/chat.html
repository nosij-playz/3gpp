<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>3GPP RAG Chatbot</title>
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --surface-secondary: #f0f2f6;
            --primary: #0071e3;
            /* Apple blue */
            --primary-hover: #005bbf;
            --primary-light: #e1f0ff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-muted: #a1a1a6;
            --border: #d2d2d7;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 16px 60px rgba(0, 0, 0, 0.12);
            --radius-sm: 10px;
            --radius-md: 18px;
            --radius-lg: 26px;
            --radius-full: 9999px;
            --transition: 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }

        /* ── App Shell ── */
        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            background: var(--surface);
            padding: 14px 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.92);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 2px 10px rgba(0, 113, 227, 0.25);
        }

        .header-info h1 {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-info .sub {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 1px;
        }

        .header-info .sub .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34c759;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        .header-actions button {
            background: none;
            border: none;
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .header-actions button:hover {
            background: var(--surface-secondary);
        }

        .header-actions button:active {
            transform: scale(0.92);
        }

        /* ── Chat Container ── */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg);
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .chat-container::-webkit-scrollbar {
            width: 3px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 12px;
        }

        /* ── Messages ── */
        .message {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            line-height: 1.55;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
            animation: msg-in 0.30s cubic-bezier(0.25, 0.1, 0.25, 1) both;
            box-shadow: var(--shadow-sm);
        }

        @keyframes msg-in {
            0% {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 12px rgba(0, 113, 227, 0.20);
        }

        .message.bot {
            align-self: flex-start;
            background: var(--surface);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .message .time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 6px;
            display: block;
            text-align: right;
            letter-spacing: 0.3px;
        }

        .message.user .time {
            color: rgba(255, 255, 255, 0.6);
        }
        .message.bot .time {
            color: var(--text-muted);
        }

        /* Sources */
        .message .sources {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .message .sources strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        .message .sources .tag {
            display: inline-block;
            background: var(--surface-secondary);
            padding: 2px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            color: var(--text-secondary);
            margin: 3px 4px 3px 0;
            border: 1px solid var(--border);
            font-weight: 500;
        }

        .message .sources .tag .score {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Abstained badge */
        .abstained-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
            font-size: 12px;
            color: #8a6d0b;
            background: #fff8e1;
            padding: 4px 14px;
            border-radius: var(--radius-full);
            font-weight: 500;
            border: 1px solid #ffe082;
        }

        /* ── Typing Indicator ── */
        .typing-indicator {
            align-self: flex-start;
            background: var(--surface);
            padding: 12px 18px;
            border-radius: var(--radius-md);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typing 1.4s ease-in-out infinite both;
        }
        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* ── Input Area ── */
        .input-area {
            flex-shrink: 0;
            padding: 10px 16px 14px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: flex-end;
            gap: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.92);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: var(--surface-secondary);
            border-radius: var(--radius-lg);
            border: 1.5px solid transparent;
            transition: var(--transition);
            padding: 2px 4px 2px 16px;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.08);
        }

        .input-wrapper textarea {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-primary);
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 120px;
            line-height: 1.5;
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }

        .input-wrapper .attach-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            padding: 8px 6px 8px 10px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-wrapper .attach-btn:hover {
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.04);
        }

        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(0, 113, 227, 0.25);
        }

        .send-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── Status Bar ── */
        .status-bar {
            flex-shrink: 0;
            padding: 6px 20px 10px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 34px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.92);
        }

        .status-bar .status-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-bar .status-dot.active {
            background: var(--primary);
        }
        .status-bar .status-dot.success {
            background: #34c759;
        }
        .status-bar .status-dot.error {
            background: #ff3b30;
        }
        .status-bar .status-dot.warning {
            background: #ff9500;
        }

        /* ── Welcome ── */
        .welcome {
            text-align: center;
            padding: 30px 16px 20px;
            color: var(--text-secondary);
        }

        .welcome .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .welcome h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .welcome p {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 280px;
            margin: 0 auto;
        }

        /* ── Settings Overlay ── */
        .settings-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
            animation: fade-in 0.25s ease;
        }

        .settings-overlay.active {
            display: flex;
        }

        @keyframes fade-in {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .settings-modal {
            background: var(--surface);
            padding: 28px 24px 24px;
            border-radius: var(--radius-md);
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            animation: slide-up 0.30s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        @keyframes slide-up {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .settings-modal .modal-icon {
            font-size: 32px;
            margin-bottom: 6px;
        }

        .settings-modal h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .settings-modal .desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .settings-modal .desc code {
            background: var(--surface-secondary);
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 13px;
            color: var(--primary);
        }

        .settings-modal label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .settings-modal input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--surface-secondary);
            transition: var(--transition);
            outline: none;
            margin-bottom: 20px;
        }

        .settings-modal input:focus {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.08);
        }

        .settings-modal .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .settings-modal .actions button {
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .settings-modal .actions .cancel {
            background: var(--surface-secondary);
            color: var(--text-secondary);
        }

        .settings-modal .actions .cancel:hover {
            background: var(--border);
        }

        .settings-modal .actions .save {
            background: var(--primary);
            color: #fff;
        }

        .settings-modal .actions .save:hover {
            background: var(--primary-hover);
        }

        .settings-modal .actions button:active {
            transform: scale(0.96);
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .app {
                max-width: 100%;
                border-radius: 0;
                height: 100dvh;
            }

            .header {
                padding: 12px 16px 10px;
            }

            .header-info h1 {
                font-size: 16px;
            }

            .chat-container {
                padding: 12px 12px 6px;
            }

            .message {
                font-size: 14px;
                padding: 10px 14px;
                max-width: 92%;
            }

            .input-area {
                padding: 8px 12px 12px;
            }

            .input-wrapper {
                padding-left: 12px;
            }

            .input-wrapper textarea {
                font-size: 15px;
                padding: 8px 0;
            }

            .settings-modal {
                padding: 24px 20px 20px;
            }
        }

        @media (max-width: 380px) {
            .header-info .sub {
                font-size: 10px;
            }
            .header-icon {
                width: 30px;
                height: 30px;
                font-size: 15px;
            }
            .message {
                font-size: 13px;
                padding: 8px 12px;
            }
            .send-btn {
                width: 40px;
                height: 40px;
                font-size: 17px;
            }
        }

        /* ── Dark Mode ── */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d0d0d;
                --surface: #1c1c1e;
                --surface-secondary: #2c2c2e;
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --text-muted: #6e6e73;
                --border: #3a3a3c;
                --primary: #0a84ff;
                --primary-hover: #0071e3;
                --primary-light: #1a2a4a;
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.5);
                --shadow-lg: 0 16px 60px rgba(0, 0, 0, 0.6);
            }

            .header {
                background: rgba(28, 28, 30, 0.92);
                border-color: var(--border);
            }

            .message.bot {
                background: var(--surface);
                border-color: var(--border);
            }

            .input-area {
                background: rgba(28, 28, 30, 0.92);
                border-color: var(--border);
            }

            .input-wrapper {
                background: var(--surface-secondary);
            }

            .input-wrapper:focus-within {
                background: var(--surface);
            }

            .status-bar {
                background: rgba(28, 28, 30, 0.92);
                border-color: var(--border);
            }

            .settings-modal {
                background: var(--surface);
            }

            .settings-modal input {
                background: var(--surface-secondary);
                color: var(--text-primary);
                border-color: var(--border);
            }

            .settings-modal input:focus {
                background: var(--surface);
            }

            .settings-modal .actions .cancel {
                background: var(--surface-secondary);
                color: var(--text-secondary);
            }

            .settings-modal .actions .cancel:hover {
                background: var(--border);
            }

            .typing-indicator {
                background: var(--surface);
                border-color: var(--border);
            }

            .message .sources .tag {
                background: var(--surface-secondary);
                border-color: var(--border);
            }

            .abstained-badge {
                background: #2c2416;
                color: #ffcc00;
                border-color: #4d3e1a;
            }

            .welcome h3 {
                color: var(--text-primary);
            }
            .welcome p {
                color: var(--text-muted);
            }
        }
    </style>
</head>
<body>

    <div class="app" role="main">

        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="header-icon" aria-hidden="true">📡</div>
                <div class="header-info">
                    <h1>3GPP RAG</h1>
                    <div class="sub">
                        <span class="dot" aria-hidden="true"></span>
                        <span>Online</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button id="settingsBtn" aria-label="Settings" title="Settings">⚙️</button>
            </div>
        </header>

        <!-- Chat -->
        <div class="chat-container" id="chatContainer">
            <!-- Welcome -->
            <div class="welcome">
                <span class="emoji">👋</span>
                <h3>Hello, I'm your 3GPP assistant</h3>
                <p>Ask me about 5G, NR, QoS, security, or any specification.</p>
            </div>
            <!-- Messages appended here -->
        </div>

        <!-- Typing indicator -->
        <div class="typing-indicator" id="typingIndicator" style="display:none; margin: 0 16px 4px; align-self: flex-start;">
            <span></span><span></span><span></span>
        </div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="questionInput" rows="1" placeholder="Ask about 3GPP…" autofocus></textarea>
                <button class="attach-btn" aria-label="Attach" title="Attach file">📎</button>
            </div>
            <button class="send-btn" id="sendBtn" aria-label="Send">➤</button>
        </div>

        <!-- Status -->
        <div class="status-bar" id="statusBar">
            <span class="status-dot" id="statusDot" aria-hidden="true"></span>
            <span id="statusText">Ready</span>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div class="settings-overlay" id="settingsOverlay" role="dialog" aria-modal="true">
        <div class="settings-modal">
            <div class="modal-icon">⚙️</div>
            <h2>Backend URL</h2>
            <p class="desc">
                Enter the URL of the running FastAPI backend.<br />
                <code>http://localhost:8000</code> or your tunnel.
            </p>
            <label for="backendUrlInput">Backend URL</label>
            <input type="url" id="backendUrlInput" placeholder="http://localhost:8000" value="{{ backend_url }}" />
            <div class="actions">
                <button class="cancel" id="cancelSettings">Cancel</button>
                <button class="save" id="saveSettings">Save</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ── DOM refs ──
            const chatContainer = document.getElementById('chatContainer');
            const questionInput = document.getElementById('questionInput');
            const sendBtn = document.getElementById('sendBtn');
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsOverlay = document.getElementById('settingsOverlay');
            const backendUrlInput = document.getElementById('backendUrlInput');
            const saveSettingsBtn = document.getElementById('saveSettings');
            const cancelSettingsBtn = document.getElementById('cancelSettings');
            const typingIndicator = document.getElementById('typingIndicator');

            let currentBackendUrl = '{{ backend_url }}';
            let isSending = false;

            // ── helpers ──
            function setStatus(text, type) {
                statusText.textContent = text;
                statusDot.className = 'status-dot';
                if (type === 'active') statusDot.classList.add('active');
                else if (type === 'success') statusDot.classList.add('success');
                else if (type === 'error') statusDot.classList.add('error');
                else if (type === 'warning') statusDot.classList.add('warning');
            }

            function getTime() {
                return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function scrollToBottom() {
                requestAnimationFrame(() => {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                });
            }

            // ── add message ──
            function addMessage(text, sender, sources, abstained) {
                // remove welcome if present
                const welcome = chatContainer.querySelector('.welcome');
                if (welcome) welcome.remove();

                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${sender}`;

                const textNode = document.createElement('div');
                textNode.textContent = text;
                msgDiv.appendChild(textNode);

                const timeSpan = document.createElement('span');
                timeSpan.className = 'time';
                timeSpan.textContent = getTime();
                msgDiv.appendChild(timeSpan);

                if (sources && sources.length > 0) {
                    const srcDiv = document.createElement('div');
                    srcDiv.className = 'sources';
                    srcDiv.innerHTML = '<strong>Sources</strong> ';
                    sources.forEach(s => {
                        const name = s.file_name || s.metadata?.file_name || 'unknown';
                        const score = (s.score || 0).toFixed(3);
                        const tag = document.createElement('span');
                        tag.className = 'tag';
                        tag.textContent = `📄 ${name}  ·  ${score}`;
                        srcDiv.appendChild(tag);
                    });
                    msgDiv.appendChild(srcDiv);
                }

                if (abstained) {
                    const badge = document.createElement('div');
                    badge.className = 'abstained-badge';
                    badge.textContent = '⚠️  Abstained — insufficient evidence';
                    msgDiv.appendChild(badge);
                }

                chatContainer.appendChild(msgDiv);
                scrollToBottom();
            }

            function showTyping() {
                typingIndicator.style.display = 'flex';
                scrollToBottom();
            }

            function hideTyping() {
                typingIndicator.style.display = 'none';
            }

            // ── send message ──
            async function sendMessage() {
                const question = questionInput.value.trim();
                if (!question || isSending) return;

                addMessage(question, 'user');
                questionInput.value = '';
                questionInput.style.height = 'auto';
                isSending = true;
                sendBtn.disabled = true;
                setStatus('Thinking…', 'active');
                showTyping();

                try {
                    const resp = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question })
                    });

                    if (!resp.ok) {
                        const err = await resp.json().catch(() => ({}));
                        throw new Error(err.error || `Server error (${resp.status})`);
                    }

                    const data = await resp.json();
                    if (data.error) throw new Error(data.error);

                    hideTyping();
                    addMessage(data.answer, 'bot', data.sources, data.abstained);
                    setStatus(
                        data.abstained ? 'Abstained — no sufficient evidence' : 'Answered with evidence',
                        data.abstained ? 'warning' : 'success'
                    );
                } catch (err) {
                    hideTyping();
                    addMessage(`❌ Error: ${err.message}`, 'bot');
                    setStatus(`Error: ${err.message}`, 'error');
                } finally {
                    isSending = false;
                    sendBtn.disabled = false;
                    questionInput.focus();
                }
            }

            function autoResize() {
                questionInput.style.height = 'auto';
                questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + 'px';
            }

            // ── settings ──
            function openSettings() {
                backendUrlInput.value = currentBackendUrl;
                settingsOverlay.classList.add('active');
            }

            function closeSettings() {
                settingsOverlay.classList.remove('active');
            }

            async function saveSettings() {
                const newUrl = backendUrlInput.value.trim();
                if (!newUrl) {
                    alert('Please enter a valid URL.');
                    return;
                }
                const cleanUrl = newUrl.replace(/\/+$/, '');
                try {
                    const resp = await fetch('/settings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `backend_url=${encodeURIComponent(cleanUrl)}`
                    });
                    const data = await resp.json();
                    if (data.status === 'ok') {
                        currentBackendUrl = cleanUrl;
                        setStatus('Backend URL updated', 'success');
                        closeSettings();
                    } else {
                        alert('Failed to save: ' + (data.message || 'unknown error'));
                    }
                } catch (e) {
                    alert('Error saving URL: ' + e.message);
                }
            }

            // ── event listeners ──
            sendBtn.addEventListener('click', sendMessage);

            questionInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            questionInput.addEventListener('input', autoResize);

            settingsBtn.addEventListener('click', openSettings);
            cancelSettingsBtn.addEventListener('click', closeSettings);
            saveSettingsBtn.addEventListener('click', saveSettings);

            settingsOverlay.addEventListener('click', (e) => {
                if (e.target === settingsOverlay) closeSettings();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && settingsOverlay.classList.contains('active')) {
                    closeSettings();
                }
            });

            questionInput.focus();

            // Expose for debugging
            window.__chat = { addMessage, setStatus };
        })();
    </script>

</body>
</html>
